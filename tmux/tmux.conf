# Mouse support
set -g mouse on

# Increase scrollback history
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Reduce escape-key delay (important for vim)
set -s escape-time 10

# Enable 256-color + true color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Reload config with prefix-r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# More intuitive pane splitting: | and - instead of % and "
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# Vi-style copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane navigation with Alt+arrow (no prefix needed)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Window navigation with Shift+arrow (no prefix needed)
bind -n S-Left  previous-window
bind -n S-Right next-window

# Status bar
set -g status-interval 5
set -g status-left  "[#S] "
set -g status-right " %H:%M %d-%b"
set -g status-left-length 20
