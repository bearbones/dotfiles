# /etc/wsl.conf for the desktop distro (bootstrap.sh installs it).

[boot]
systemd=true

[interop]
enabled=true
# Don't splice the Windows PATH into Linux: Windows node/python/git would
# shadow the Linux ones and every PATH lookup crosses the slow 9P boundary.
# Windows tools we do want (VS Code, powershell.exe) are added in common.sh.
appendWindowsPath=false

[user]
default=__USER__
