# Starship prompt — one config, identical in zsh (local) and bash (devspaces).
# Catppuccin Mocha to match the terminal/tmux chrome (Neovim stays Gruvbox).
# The hostname segment only appears over SSH and is red, so a devspace prompt
# is instantly distinguishable from a local one.

add_newline = false

format = """
$hostname\
$directory\
$git_branch$git_status\
$cmd_duration\
$character"""

palette = "catppuccin_mocha"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface0 = "#313244"
base = "#1e1e2e"

[hostname]
ssh_only = true                 # only shown over SSH (i.e. a devspace)
format = "[$hostname]($style) "
style = "bold red"              # the devspace cue

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "mauve"

[git_status]
style = "peach"

[cmd_duration]
min_time = 2000                 # only show for commands slower than 2s
format = "[$duration]($style) "
style = "overlay1"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](sky)"       # shown in vi normal mode
